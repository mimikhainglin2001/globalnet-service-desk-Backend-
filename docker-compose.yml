# One command: docker compose up --build
# API: http://localhost:8080/api/v1   (MySQL exposed on localhost:3316)
x-api: &api
  build:
    context: ./api
  image: globalnet-api
  restart: unless-stopped
  environment: &api-env
    APP_NAME: "GlobalNet Service Desk"
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8080
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: globalnet_service_desk
    DB_USERNAME: root
    DB_PASSWORD: ${DB_PASSWORD:-root}
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: array
    MAIL_MAILER: log
  volumes:
    - api_storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    container_name: globalnet-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: globalnet_service_desk
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3316:3306"
    volumes:
      - globalnet_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *api
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    healthcheck:
      test: ["CMD-SHELL", "php artisan migrate:status > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/public:/var/www/html/public:ro
    depends_on:
      - app

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "--tries=5", "--backoff=10", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  globalnet_mysql_data:
  api_storage:
